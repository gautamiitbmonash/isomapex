<!--
SETUP (one time): run this SQL in Supabase -> SQL Editor (also saved as supabase-setup.sql),
turn OFF "Confirm email" (Authentication -> Sign In / Providers -> Email),
then paste your Project URL and anon key into the CONFIG block in the script below.

-- SafePath setup. Run once in Supabase: SQL Editor -> New query -> paste -> Run.
-- Also turn OFF "Confirm email": Authentication -> Sign In / Providers -> Email.

-- 1) One row per mapping session
create table if not exists public.sp_sessions (
  id           uuid primary key default gen_random_uuid(),
  user_id      uuid not null default auth.uid() references auth.users(id) on delete cascade,
  username     text,
  session_no   text not null,
  return_type  text,                       -- reversed / new / none
  created_at   timestamptz not null default now(),
  closed_at    timestamptz,
  unique (user_id, session_no)
);

-- 2) Numbered journey points (start, transit stops, destination), outward + return
create table if not exists public.sp_journey_points (
  id          uuid primary key default gen_random_uuid(),
  session_id  uuid not null references public.sp_sessions(id) on delete cascade,
  user_id     uuid not null default auth.uid() references auth.users(id) on delete cascade,
  direction   text not null check (direction in ('forward','return')),
  seq         int  not null,
  role        text not null check (role in ('start','transit','destination')),
  mode        text,                        -- mode of transport to the NEXT point
  label       text,
  lat         double precision not null,
  lng         double precision not null,
  created_at  timestamptz not null default now()
);

-- 3) Safety experience pins
create table if not exists public.sp_experiences (
  id              uuid primary key default gen_random_uuid(),
  session_id      uuid not null references public.sp_sessions(id) on delete cascade,
  user_id         uuid not null default auth.uid() references auth.users(id) on delete cascade,
  category        text not null,
  category_label  text,
  condition       text,
  feeling         text,                    -- safe / neutral / unsafe
  time_of_day     text,
  journey         text,                    -- forward / return / both / off_route
  note            text,
  lat             double precision not null,
  lng             double precision not null,
  created_at      timestamptz not null default now()
);

-- Row Level Security: every user can only see and write their own data.
-- (Journey points include a person's home, so nothing is public.)
alter table public.sp_sessions       enable row level security;
alter table public.sp_journey_points enable row level security;
alter table public.sp_experiences    enable row level security;

create policy "own sessions select" on public.sp_sessions for select to authenticated using (auth.uid() = user_id);
create policy "own sessions insert" on public.sp_sessions for insert to authenticated with check (auth.uid() = user_id);
create policy "own sessions delete" on public.sp_sessions for delete to authenticated using (auth.uid() = user_id);

create policy "own points select" on public.sp_journey_points for select to authenticated using (auth.uid() = user_id);
create policy "own points insert" on public.sp_journey_points for insert to authenticated
  with check (auth.uid() = user_id and exists (select 1 from public.sp_sessions s where s.id = session_id and s.user_id = auth.uid()));
create policy "own points delete" on public.sp_journey_points for delete to authenticated using (auth.uid() = user_id);

create policy "own experiences select" on public.sp_experiences for select to authenticated using (auth.uid() = user_id);
create policy "own experiences insert" on public.sp_experiences for insert to authenticated
  with check (auth.uid() = user_id and exists (select 1 from public.sp_sessions s where s.id = session_id and s.user_id = auth.uid()));
create policy "own experiences delete" on public.sp_experiences for delete to authenticated using (auth.uid() = user_id);

-- To collect everyone's data as the project owner: Table Editor -> pick a table -> Export -> CSV.

-->

<style>
  :root{ --bg:#fff; --fg:#1f2430; --muted:#6b7280; --line:#e5e7eb; --brand:#7c3aed; --brand-d:#6d28d9; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg)}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}
  header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--line);z-index:1000;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;flex:1;white-space:nowrap}
  header h1 span{color:var(--brand)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;color:var(--fg)}
  button:hover{background:#f5f3ff}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  button.primary:hover{background:var(--brand-d)}
  button.danger{color:#b91c1c;border-color:#fecaca}
  #userLabel{font-size:12px;color:var(--muted);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #mapWrap{position:relative;flex:1;min-height:0}
  #map{position:absolute;inset:0}

  /* bottom dock */
  #dock{background:var(--bg);border-top:1px solid var(--line);padding:8px 10px;z-index:1000;max-height:48vh;overflow:auto}
  #steps{display:flex;gap:6px;margin-bottom:6px;font-size:11px}
  .step{flex:1;text-align:center;padding:4px 2px;border-radius:999px;background:#f3f4f6;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .step.on{background:var(--brand);color:#fff}
  .step.done{background:#ede9fe;color:var(--brand-d)}
  #msg{font-size:13px;margin:0 0 6px;line-height:1.35}
  #actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .dragpt{padding:7px 11px;border:2px dashed var(--brand);border-radius:8px;color:var(--brand-d);font-size:13px;cursor:grab;user-select:none;-webkit-user-select:none}
  @media (pointer:coarse){.dragpt{display:none}}

  #chips{display:none;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;width:82px;padding:6px 4px;border:2px solid transparent;border-radius:10px;background:#fafafa;cursor:grab;user-select:none;-webkit-user-select:none;font-size:11px;text-align:center;line-height:1.15}
  .chip .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:19px;color:#fff}
  .chip.sel{border-color:var(--brand);background:#f5f3ff}

  /* journey point markers */
  .np{position:relative;width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .np.forward{background:#1d4ed8}
  .np.return{background:#be185d}
  .np[data-r="start"]::after{content:"🏠";position:absolute;top:-14px;right:-12px;font-size:14px}
  .np[data-r="destination"]::after{content:"🏁";position:absolute;top:-14px;right:-12px;font-size:14px}

  /* safety experience pins */
  .pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
  .pin span{transform:rotate(45deg);font-size:16px;line-height:1}
  .pin.draft{animation:bounce .6s ease infinite alternate}
  @keyframes bounce{to{margin-top:-6px}}

  /* popups */
  .pf{min-width:220px;font-size:13px}
  .pf h4{margin:0 0 6px;font-size:14px}
  .pf label{display:block;font-size:11px;color:var(--muted);margin:7px 0 2px}
  .pf input,.pf textarea,.pf select{width:100%;font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .pf textarea{resize:vertical;min-height:54px}
  .pf .row{display:flex;gap:6px;margin-top:8px}
  .pf .meta{font-size:11px;color:var(--muted);margin-top:4px}
  .pf p{margin:3px 0;white-space:pre-wrap;word-break:break-word}
  .pf .ring{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

  /* modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:5000;padding:16px;overflow:auto}
  #modal.open{display:flex}
  .card{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:360px}
  .card h2{margin:0 0 4px;font-size:18px}
  .card p.sub{margin:0 0 12px;font-size:13px;color:var(--muted);line-height:1.4}
  .card input{width:100%;padding:9px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;font:inherit}
  .card .row{display:flex;gap:8px}
  .card .row button{flex:1}
  .card button.big{display:block;width:100%;margin-bottom:8px;text-align:left;padding:10px 12px}
  .card .link{background:none;border:none;color:var(--brand);padding:0;margin-top:10px;font-size:13px}
  .cardmsg{font-size:12px;color:#b91c1c;min-height:16px;margin-bottom:6px;line-height:1.35}
  .cardmsg.ok{color:#15803d}

  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;z-index:6000;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92%;text-align:center}
  #toast.show{opacity:1}
  #banner{display:none;background:#fef3c7;color:#92400e;font-size:12px;padding:6px 12px;text-align:center}
  @media (min-width:700px){ .chip{width:96px} }
</style>

<body>

<script>
/* =================  CONFIG  ================= */
const SUPABASE_URL      = "https://crmbaistgufpxdcqepgp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNybWJhaXN0Z3VmcHhkY3FlcGdwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNjMwNDQsImV4cCI6MjEwNjgzOTA0NH0.LT3bmRqo44TCYcag5vhriJS-tCCB4MWkYBeDCTbyUk8";
const MAPTILER_KEY      = "";                    // optional free key: https://cloud.maptiler.com/account/keys/
const DEFAULT_CENTER    = [20.5937, 78.9629];    // [lat, lng] used until GPS answers
const DEFAULT_ZOOM      = 5;
// Usernames become username@USER_DOMAIN behind the scenes (Supabase needs an email-shaped login).
// Supabase checks that this domain can receive mail (it has MX records), so an invented domain is rejected
// with "Email address ... is invalid". Best: a domain you own (with any MX record). No email is ever sent
// while "Confirm email" is OFF, so the default below is just a placeholder with valid MX records.
const USER_DOMAIN       = "mailinator.com";
/* ============================================ */

const T = { sessions:"sp_sessions", points:"sp_journey_points", exps:"sp_experiences" };

const MODES = [
  ["foot","🚶 On foot"], ["bus","🚌 Bus"], ["train","🚆 Train"], ["metro","🚇 Metro"],
  ["rickshaw","🛺 Rickshaw"], ["taxi","🚕 Taxi / cab"], ["motorcycle","🏍️ Motorcycle"], ["cycle","🚲 Cycle"]
];
const DIRS = {
  forward:{ name:"Outward", color:"#1d4ed8" },
  return: { name:"Return",  color:"#be185d" }
};
const FEELINGS = [
  { id:"safe",    label:"Felt safe",            color:"#16a34a" },
  { id:"neutral", label:"Neutral / uncertain",  color:"#f59e0b" },
  { id:"unsafe",  label:"Felt unsafe",          color:"#dc2626" }
];
const FEEL = Object.fromEntries(FEELINGS.map(f=>[f.id,f]));
const TIMES = ["Morning","Afternoon","Evening","Night","Not sure"];

/* Safety parameters – adapted from common women's-safety audit frameworks (e.g. Safetipin's
   lighting / openness / visibility / people / security / walk path / public transport / gender
   diversity) and from the "Why Loiter?" themes (toilets, places to linger, shops, harassment,
   pleasure). Edit this list freely to match your own research instrument. */
const CATS = [
  { id:"lighting",   label:"Lighting",              icon:"💡", color:"#f59e0b", opts:["Well lit","Partly lit","Poorly lit","No lighting","Lights broken / flickering"] },
  { id:"openness",   label:"Openness / sight lines",icon:"🏞️", color:"#0ea5e9", opts:["Open, clear sight lines","Partly blocked (walls, hoardings, parked vehicles)","Narrow or enclosed, blind corners","Underpass / subway / tunnel","Dense vegetation or ruins"] },
  { id:"visibility", label:"Eyes on the street",    icon:"👁️", color:"#a855f7", opts:["Many eyes (shops, windows, balconies facing street)","Some places overlook the street","Blank walls, nobody overlooking","Cannot be seen from the road"] },
  { id:"people",     label:"People around",         icon:"👥", color:"#14b8a6", opts:["Active, comfortably busy","A few people","Empty / deserted","Crowded and uncomfortable"] },
  { id:"security",   label:"Security & help",       icon:"👮", color:"#2563eb", opts:["Police / guard visible","CCTV visible","Help point / emergency button","Nobody to ask for help","Security present but unhelpful"] },
  { id:"walkpath",   label:"Walking path",          icon:"🚶‍♀️", color:"#65a30d", opts:["Good, continuous footpath","Broken or uneven","Blocked / encroached (vehicles, vendors)","No footpath (walk on the road)","Waterlogged or littered"] },
  { id:"transport",  label:"Public transport",      icon:"🚌", color:"#0891b2", opts:["Stop/station close, frequent service","Infrequent service, long waits","Stop poorly lit or isolated","Far from my destination","Crowded and unsafe to board"] },
  { id:"gender",     label:"Gender diversity",      icon:"♀️", color:"#d946ef", opts:["Many women and girls present","Some women present","Mostly men","Only men"] },
  { id:"toilet",     label:"Public toilet",         icon:"🚻", color:"#6366f1", opts:["Available, clean and safe","Available but dirty or unsafe","Locked / out of order","Paid and unaffordable","None nearby"] },
  { id:"sit",        label:"Places to sit / linger",icon:"🪑", color:"#16a34a", opts:["Can sit and linger comfortably","Can linger but get stared at","Nowhere to sit","Asked to move along","Seating only for men"] },
  { id:"shops",      label:"Shops, vendors, eateries", icon:"🏪", color:"#f97316", opts:["Open late and welcoming","Open but unwelcoming","Mostly closed / shuttered","Only liquor shops or male hangouts","None"] },
  { id:"harassment", label:"Harassment",            icon:"⚠️", color:"#dc2626", opts:["Staring","Comments / catcalling","Followed","Touching / groping","Other harassment"] },
  { id:"pleasure",   label:"Place of pleasure / comfort", icon:"🌸", color:"#f472b6", opts:["Felt welcome and free to linger","Enjoyable (greenery, music, activity)","Safe because of familiar people","A place I choose to return to"] }
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
function toast(msg, ms=2800){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),ms); }
function el(tag, props={}, ...kids){ const e=document.createElement(tag); Object.assign(e,props); kids.forEach(k=>e.append(k)); return e; }
function select(options, value, placeholder){
  const s = el("select");
  if(placeholder){ const o=new Option(placeholder,"",true,true); o.disabled=true; s.append(o); }
  options.forEach(o=>{ const [v,t]=Array.isArray(o)?o:[o,o]; s.append(new Option(t,v)); });
  if(value!==undefined && value!==null && value!=="") s.value=value;
  return s;
}
function btn(text, cls, fn){ const b=el("button",{textContent:text,className:cls||""}); b.onclick=fn; return b; }

const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR-ANON");
if(!configured) $("banner").style.display = "block";
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ---------- state ---------- */
let user = null, username = "";
let sessionNo = null;
let phase = "idle";            // idle | fwd | ret-choice | ret-new | ret-rev | exp | saved
let returnType = null;         // reversed | new | none
const J = { forward:[], return:[] };      // journey points {lat,lng via marker, mode, label, marker}
const done = { forward:false, return:false };
let EXPS = [];                 // experiences {type,condition,feeling,time,journey,note,marker}
let draft = null;              // unsaved experience marker being edited
let selectedType = null;
let restoring = false;
const lines = { forward:null, return:null };

/* ---------- map ---------- */
const map = L.map("map", { zoomControl:true }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
const OSM_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const hosted = location.protocol.startsWith("http");   // OSM's own tiles only serve pages that send a Referer
const baseLayers = {};
if(MAPTILER_KEY){
  baseLayers["MapTiler Streets (OSM data)"] = L.tileLayer(
    "https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key="+encodeURIComponent(MAPTILER_KEY),
    { tileSize:512, zoomOffset:-1, maxZoom:19, attribution:'&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> '+OSM_ATTR });
}
const osmStd = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom:19, referrerPolicy:"strict-origin-when-cross-origin", attribution:OSM_ATTR });
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
  { maxZoom:19, attribution:'Tiles &copy; Esri, HERE, Garmin, OpenStreetMap contributors' });
if(hosted){ baseLayers["OpenStreetMap standard"] = osmStd; baseLayers["Esri Streets (no key)"] = esri; }
else      { baseLayers["Esri Streets (no key)"] = esri; baseLayers["OpenStreetMap standard (hosted https only)"] = osmStd; }
baseLayers["OSM France (no key)"] = L.tileLayer("https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",
  { maxZoom:19, subdomains:"abc", attribution:'&copy; OpenStreetMap France | '+OSM_ATTR });

const baseNames = Object.keys(baseLayers);
let currentBase = baseNames[0];
baseLayers[currentBase].addTo(map);
map.on("baselayerchange", e => { currentBase = e.name; });

const gF = L.layerGroup().addTo(map);   // outward journey layer
const gR = L.layerGroup().addTo(map);   // return journey layer
const gE = L.layerGroup().addTo(map);   // safety experiences layer
L.control.layers(baseLayers, { "Outward journey":gF, "Return journey":gR, "Safety experiences":gE }, { position:"topright", collapsed:true }).addTo(map);
const group = dir => dir==="forward" ? gF : gR;

let tileErrors = 0;
baseNames.forEach(name=>{
  baseLayers[name].on("tileerror", ()=>{
    if(name !== currentBase || ++tileErrors < 6) return;
    tileErrors = 0;
    const next = baseNames[(baseNames.indexOf(name)+1) % baseNames.length];
    map.removeLayer(baseLayers[name]); baseLayers[next].addTo(map); currentBase = next;
    toast("Map tiles failed – switched to “"+next+"”", 4500);
  });
});

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p => map.setView([p.coords.latitude,p.coords.longitude],15), ()=>{}, {timeout:6000});
}

/* ---------- journey points ---------- */
const roleOf = (dir,i) => i===0 ? "start" : (done[dir] && i===J[dir].length-1 ? "destination" : "transit");
function roleName(dir, role){
  if(role==="start") return dir==="forward" ? "Start (home)" : "Start of return";
  if(role==="destination") return "Destination";
  return "Transit point";
}
function jIcon(dir, i, role){
  return L.divIcon({ className:"", html:`<div class="np ${dir}" data-r="${role}">${i+1}</div>`, iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16] });
}
function drawLine(dir){
  if(lines[dir]){ group(dir).removeLayer(lines[dir]); lines[dir]=null; }
  const pts = J[dir].map(p=>p.marker.getLatLng());
  if(pts.length>=2){
    lines[dir] = L.polyline(pts, { color:DIRS[dir].color, weight:4, opacity:.8, dashArray: dir==="return" ? "8 8" : null, interactive:false }).addTo(group(dir));
  }
}
function refreshJourney(dir){
  J[dir].forEach((p,i)=>p.marker.setIcon(jIcon(dir,i,roleOf(dir,i))));
  drawLine(dir);
}
function addJourneyPoint(dir, ll, data={}){
  const p = { mode: data.mode===undefined ? "foot" : data.mode, label: data.label||"" };
  p.marker = L.marker([ll.lat,ll.lng], { icon:jIcon(dir,J[dir].length,"transit"), draggable:true, zIndexOffset:500 }).addTo(group(dir));
  p.marker.bindPopup(()=>journeyPopup(dir,p), { minWidth:230, closeOnClick:false });
  p.marker.on("drag", ()=>drawLine(dir));
  p.marker.on("dragend", saveDraft);
  J[dir].push(p);
  refreshJourney(dir); saveDraft(); updateUI();
  if(!data.silent) p.marker.openPopup();
  return p;
}
function removeJourneyPoint(dir, p){
  group(dir).removeLayer(p.marker);
  J[dir].splice(J[dir].indexOf(p),1);
  refreshJourney(dir); saveDraft(); updateUI();
}
function journeyPopup(dir, p){
  const idx = J[dir].indexOf(p), role = roleOf(dir,idx);
  const box = el("div",{className:"pf"}, el("h4",{textContent:`${idx+1}. ${roleName(dir,role)} · ${DIRS[dir].name.toLowerCase()} journey`}));
  const label = el("input",{type:"text", placeholder:"Place / stop name (optional)", maxLength:80, value:p.label});
  label.oninput = ()=>{ p.label = label.value; saveDraft(); };
  box.append(el("label",{textContent:"Name"}), label);
  if(role!=="destination"){
    const m = select(MODES, p.mode);
    m.onchange = ()=>{ p.mode = m.value; saveDraft(); };
    box.append(el("label",{textContent:"Mode of transport to the next point"}), m);
  } else {
    box.append(el("div",{className:"meta",textContent:"Destination – the end of this journey."}));
  }
  if((phase==="fwd" && dir==="forward") || (phase==="ret-new" && dir==="return")){
    box.append(el("div",{className:"row"}, btn("Remove point","danger",()=>removeJourneyPoint(dir,p))));
  }
  return box;
}
function fitAll(){
  const b = L.latLngBounds([]);
  J.forward.concat(J.return).forEach(p=>b.extend(p.marker.getLatLng()));
  if(b.isValid()) map.fitBounds(b,{ padding:[40,40], maxZoom:17 });
}
function finishJourney(dir){
  const arr = J[dir];
  if(arr.length<2){ toast("Add at least a start and a destination first."); return; }
  done[dir] = true;
  arr[arr.length-1].mode = null;
  refreshJourney(dir); map.closePopup(); fitAll();
  if(dir==="forward") openReturnChoice(); else goExperiences();
}
function undoLast(dir){
  const arr = J[dir]; if(!arr.length) return;
  removeJourneyPoint(dir, arr[arr.length-1]);
}
function buildReversed(){
  const f = J.forward, n = f.length;
  for(let i=0;i<n;i++){
    const src = f[n-1-i], ll = src.marker.getLatLng();
    // leg between two points keeps its mode when travelled backwards
    const mode = i<n-1 ? f[n-2-i].mode : null;
    addJourneyPoint("return", ll, { mode, label:src.label, silent:true });
  }
  done.return = true;
  refreshJourney("return");
}
function openReturnChoice(){
  phase = "ret-choice"; saveDraft(); updateUI();
  const card = el("div",{className:"card"},
    el("h2",{textContent:"Outward journey complete ✔"}),
    el("p",{className:"sub", textContent:"How do you want to record your return journey? Return points are shown in a different colour."}),
    btn("🔁 Same points, in reverse order","big",()=>{ closeModal(); returnType="reversed"; buildReversed(); phase="ret-rev"; fitAll(); saveDraft(); updateUI(); }),
    btn("📍 New points (different route)","big",()=>{ closeModal(); returnType="new"; phase="ret-new"; saveDraft(); updateUI(); }),
    btn("⏭ No return journey","big",()=>{ closeModal(); returnType="none"; goExperiences(); }));
  openModal(card);
}
function goExperiences(){
  phase = "exp"; saveDraft(); updateUI();
  toast("Step 3: now mark your safety experiences along the route");
}

/* ---------- placing things ---------- */
function handleMapPlace(ll){
  if(phase==="fwd") addJourneyPoint("forward", ll);
  else if(phase==="ret-new") addJourneyPoint("return", ll);
  else if(phase==="exp"){ if(selectedType) startDraft(selectedType, ll); else toast("Pick a safety icon first 👇"); }
  else if(phase==="ret-rev") toast("Drag pins to adjust them, then confirm the return journey.");
}
map.on("click", e => handleMapPlace(e.latlng));

const mapEl = map.getContainer();
mapEl.addEventListener("dragover", e=>{ e.preventDefault(); e.dataTransfer.dropEffect="copy"; });
mapEl.addEventListener("drop", e=>{
  e.preventDefault();
  const id = e.dataTransfer.getData("text/plain");
  const ll = map.mouseEventToLatLng(e);
  if(id==="journey-point"){
    if(phase==="fwd") addJourneyPoint("forward", ll);
    else if(phase==="ret-new") addJourneyPoint("return", ll);
    else toast("Journey points can't be added right now.");
    return;
  }
  if(CAT[id]){
    if(phase!=="exp"){ toast("Safety icons are available in step 3."); return; }
    startDraft(id, ll);
  }
});

$("btnGps").onclick = ()=>{
  if(!user || !sessionNo){ toast("Log in and start a session first."); return; }
  if(phase==="exp" && !selectedType){ toast("Pick a safety icon first 👇"); return; }
  if(!["fwd","ret-new","exp"].includes(phase)){ toast("Nothing to place right now."); return; }
  if(!navigator.geolocation){ toast("GPS not available on this device"); return; }
  toast("Getting your location…");
  navigator.geolocation.getCurrentPosition(
    p=>{ const ll = L.latLng(p.coords.latitude,p.coords.longitude); map.setView(ll, Math.max(map.getZoom(),17)); handleMapPlace(ll); },
    err=> toast("Couldn't get location: "+err.message, 4500),
    { enableHighAccuracy:true, timeout:15000, maximumAge:0 });
};

/* ---------- safety experience palette + pins ---------- */
function buildPalette(){
  const box = $("chips");
  CATS.forEach(c=>{
    const chip = el("div",{className:"chip", draggable:true, id:"chip-"+c.id});
    const ico = el("div",{className:"ico", textContent:c.icon}); ico.style.background = c.color;
    chip.append(ico, el("span",{textContent:c.label}));
    chip.addEventListener("dragstart", e=>{ e.dataTransfer.setData("text/plain", c.id); e.dataTransfer.effectAllowed="copy"; selectType(c.id,true); });
    chip.addEventListener("click", ()=> selectType(selectedType===c.id ? null : c.id));
    box.append(chip);
  });
}
function selectType(id, quiet){
  selectedType = id;
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("sel", c.id==="chip-"+id));
  map.getContainer().style.cursor = id ? "crosshair" : "";
  if(id && !quiet) toast(`${CAT[id].icon} ${CAT[id].label}: tap the map or press “My location”`);
}
function pinIcon(cat, feeling, isDraft){
  const ring = feeling ? FEEL[feeling].color : "#fff";
  return L.divIcon({ className:"", iconSize:[34,34], iconAnchor:[17,41], popupAnchor:[0,-38],
    html:`<div class="pin ${isDraft?"draft":""}" style="background:${cat.color};border-color:${ring}"><span>${cat.icon}</span></div>` });
}
function journeyOptions(){
  const o = [["forward","Outward journey"]];
  if(returnType && returnType!=="none" && done.return) o.push(["return","Return journey"],["both","Both directions"]);
  o.push(["off_route","Off my route"]);
  return o;
}
const JOURNEY_NAME = { forward:"Outward journey", return:"Return journey", both:"Both directions", off_route:"Off my route" };

function clearDraft(){ if(draft){ map.removeLayer(draft); draft=null; } }
function startDraft(typeId, ll){
  if(phase!=="exp") return;
  clearDraft();
  const cat = CAT[typeId];
  const m = L.marker(ll, { icon:pinIcon(cat,null,true), draggable:true, zIndexOffset:1000 }).addTo(map);
  draft = m;
  const cond = select(cat.opts, "", "Select…");
  const feel = select(FEELINGS.map(f=>[f.id,f.label]), "", "Select…");
  const jr = select(journeyOptions());
  const time = select(TIMES, "Not sure");
  const note = el("textarea",{ placeholder:"Anything else? (optional)", maxLength:500 });
  const add = btn("Add to session","primary",()=>{
    if(!cond.value || !feel.value){ toast("Please choose the condition and how it felt."); return; }
    const data = { type:typeId, lat:m.getLatLng().lat, lng:m.getLatLng().lng, condition:cond.value, feeling:feel.value, time:time.value, journey:jr.value, note:note.value.trim() };
    clearDraft(); const e = addExperience(data); e.marker.openPopup(); toast("Pin added ✔");
  });
  const cancel = btn("Cancel","",clearDraft);
  const form = el("div",{className:"pf"},
    el("h4",{textContent:`${cat.icon} ${cat.label}`}),
    el("div",{className:"meta",textContent:"Drag the pin to fine-tune its position."}),
    el("label",{textContent:cat.label+" – what was it like?"}), cond,
    el("label",{textContent:"How did it feel here?"}), feel,
    el("label",{textContent:"Which journey?"}), jr,
    el("label",{textContent:"Time of day"}), time,
    el("label",{textContent:"Notes"}), note,
    el("div",{className:"row"}, add, cancel));
  m.bindPopup(form, { autoClose:false, closeOnClick:false, minWidth:240 }).openPopup();
  selectType(null);
}
function addExperience(data){
  const cat = CAT[data.type] || { icon:"📍", color:"#6b7280", label:data.type };
  const marker = L.marker([data.lat,data.lng], { icon:pinIcon(cat,data.feeling), draggable:true }).addTo(gE);
  const e = { type:data.type, condition:data.condition, feeling:data.feeling, time:data.time, journey:data.journey, note:data.note||"", marker };
  marker.bindPopup(()=>{
    const f = FEEL[e.feeling];
    const box = el("div",{className:"pf"}, el("h4",{textContent:`${cat.icon} ${cat.label}`}),
      el("p",{textContent:e.condition}));
    const feel = el("p"); feel.append(el("span",{className:"ring"}), f?f.label:""); if(f) feel.firstChild.style.background=f.color;
    box.append(feel);
    box.append(el("div",{className:"meta",textContent:`${JOURNEY_NAME[e.journey]||e.journey} · ${e.time}`}));
    if(e.note) box.append(el("p",{textContent:e.note}));
    box.append(el("div",{className:"row"}, btn("Remove","danger",()=>{ gE.removeLayer(marker); EXPS.splice(EXPS.indexOf(e),1); saveDraft(); updateUI(); })));
    return box;
  }, { minWidth:220, closeOnClick:false });
  marker.on("dragend", saveDraft);
  EXPS.push(e); saveDraft(); updateUI();
  return e;
}

/* ---------- modal ---------- */
function openModal(node){ const m=$("modal"); m.replaceChildren(node); m.classList.add("open"); }
function closeModal(){ const m=$("modal"); m.classList.remove("open"); m.replaceChildren(); }

/* ---------- UI state (steps, message, buttons) ---------- */
function updateUI(){
  $("userLabel").textContent = user ? "@"+username + (sessionNo ? " · Session "+sessionNo : "") : "";
  $("btnOut").style.display = user ? "" : "none";
  const idx = { fwd:0, "ret-choice":1, "ret-new":1, "ret-rev":1, exp:2, saved:3 }[phase];
  document.querySelectorAll(".step").forEach((s,i)=>{ s.classList.toggle("on", i===idx); s.classList.toggle("done", idx!==undefined && i<idx); });
  $("chips").style.display = phase==="exp" ? "flex" : "none";
  const act = $("actions"); act.replaceChildren();
  const msg = $("msg");
  const journeyActions = dir => {
    const chip = el("div",{className:"dragpt",draggable:true,textContent:"📍 Drag me onto the map"});
    chip.addEventListener("dragstart",ev=>{ ev.dataTransfer.setData("text/plain","journey-point"); ev.dataTransfer.effectAllowed="copy"; });
    const undo = btn("↩ Undo last","",()=>undoLast(dir)); undo.disabled = J[dir].length===0;
    const fin = btn("🏁 Finish – last point is my destination","primary",()=>finishJourney(dir)); fin.disabled = J[dir].length<2;
    act.append(chip, undo, fin);
  };
  if(phase==="fwd" || phase==="ret-new"){
    const dir = phase==="fwd" ? "forward" : "return", n = J[dir].length;
    const who = dir==="forward" ? "Outward journey" : "Return journey";
    msg.textContent = n===0
      ? `${who}: tap the map (or press 📍 My location) to place point 1 – ${dir==="forward"?"your home / starting point":"the start of your return"}.`
      : `${who}: ${n} point${n>1?"s":""} placed. Add the next transit point (bus/train stop, a change…) or, when you reach your destination, add it and press Finish. Tap a numbered point to set its mode of transport.`;
    journeyActions(dir);
  } else if(phase==="ret-rev"){
    msg.textContent = "Return journey pre-filled in reverse order. Drag points if the route differs and tap a point to check its mode of transport, then confirm.";
    act.append(btn("✔ Confirm return journey","primary",()=>{ map.closePopup(); goExperiences(); }));
  } else if(phase==="ret-choice"){
    msg.textContent = "Choose how to record your return journey.";
  } else if(phase==="exp"){
    msg.textContent = "Step 3 – drag an icon onto the map (or tap an icon, then tap the map / press 📍 My location), then answer the questions. The pin's ring shows how it felt: green safe · amber uncertain · red unsafe.";
    act.append(btn("💾 Close & save session","primary",saveSession));
  } else if(phase==="saved"){
    msg.textContent = "Session saved ✔";
  } else {
    msg.textContent = "Log in and enter a session number to begin.";
  }
  if(sessionNo && phase!=="saved") act.append(btn("✖ Discard session","danger",discardSession));
}

/* ---------- draft (auto-saved in this browser until the session is saved) ---------- */
const draftKey = () => "safepath_draft_v1_"+(user?user.id:"anon");
function saveDraft(){
  if(restoring || !user || !sessionNo || phase==="saved") return;
  const ser = a => a.map(p=>{ const ll=p.marker.getLatLng(); return { lat:ll.lat, lng:ll.lng, mode:p.mode, label:p.label }; });
  const d = { sessionNo, phase, returnType, done, forward:ser(J.forward), return:ser(J.return),
    exps:EXPS.map(e=>{ const ll=e.marker.getLatLng(); return { type:e.type, lat:ll.lat, lng:ll.lng, condition:e.condition, feeling:e.feeling, time:e.time, journey:e.journey, note:e.note }; }) };
  try{ localStorage.setItem(draftKey(), JSON.stringify(d)); }catch(_){}
}
function loadDraft(){ try{ const s=localStorage.getItem(draftKey()); return s ? JSON.parse(s) : null; }catch(_){ return null; } }
function clearStoredDraft(){ try{ localStorage.removeItem(draftKey()); }catch(_){} }
function restoreDraft(d){
  restoring = true;
  resetSession();
  sessionNo = d.sessionNo; returnType = d.returnType || null;
  d.forward.forEach(p=>addJourneyPoint("forward", p, { mode:p.mode, label:p.label, silent:true }));
  d.return.forEach(p=>addJourneyPoint("return", p, { mode:p.mode, label:p.label, silent:true }));
  done.forward = !!d.done.forward; done.return = !!d.done.return;
  refreshJourney("forward"); refreshJourney("return");
  d.exps.forEach(addExperience);
  restoring = false;
  phase = d.phase;
  if(phase==="ret-choice"){ openReturnChoice(); } else { updateUI(); }
  fitAll();
  toast("Resumed session "+sessionNo);
}

/* ---------- session life-cycle ---------- */
function resetSession(){
  gF.clearLayers(); gR.clearLayers(); gE.clearLayers();
  J.forward=[]; J.return=[]; EXPS=[]; lines.forward=null; lines.return=null;
  done.forward=false; done.return=false; returnType=null; sessionNo=null; phase="idle";
  clearDraft(); selectType(null); updateUI();
}
function showSessionPrompt(){
  const msg = el("div",{className:"cardmsg"});
  const input = el("input",{type:"text", placeholder:"Session number, e.g. 12 or A-07", maxLength:30});
  const go = btn("Start session","primary", async ()=>{
    const no = input.value.trim();
    if(!no){ msg.textContent="Please type a session number."; return; }
    if(!configured){ msg.textContent="Supabase isn't configured yet."; return; }
    go.disabled = true; msg.textContent="";
    const { data, error } = await sb.from(T.sessions).select("id").eq("user_id",user.id).eq("session_no",no).maybeSingle();
    go.disabled = false;
    if(error){ msg.textContent = "Could not check the session number: "+error.message; return; }
    if(data){ msg.textContent = "You have already saved a session numbered “"+no+"”. Please choose another number."; return; }
    resetSession(); sessionNo = no; phase = "fwd"; closeModal(); updateUI(); saveDraft();
    toast("Session "+no+" started. Place your starting point.");
  });
  input.addEventListener("keydown", e=>{ if(e.key==="Enter") go.click(); });
  openModal(el("div",{className:"card"},
    el("h2",{textContent:"New session"}),
    el("p",{className:"sub",textContent:"Type your session number. You will then map your journey step by step, starting from home."}),
    msg, input, go));
  setTimeout(()=>input.focus(),50);
}
function discardSession(){
  if(!confirm("Discard session "+sessionNo+"? Everything you've marked so far will be lost.")) return;
  clearStoredDraft(); resetSession(); showSessionPrompt();
}
async function saveSession(){
  if(!done.forward){ toast("Finish your outward journey first."); return; }
  if(!EXPS.length && !confirm("You haven't marked any safety experiences. Save the session anyway?")) return;
  if(!confirm("Close and save session “"+sessionNo+"”? You won't be able to edit it afterwards.")) return;
  toast("Saving…", 8000);
  const ses = await sb.from(T.sessions).insert({ session_no:sessionNo, username, return_type:returnType||"none", closed_at:new Date().toISOString() }).select().single();
  if(ses.error){ toast(ses.error.code==="23505" ? "That session number was already saved. Discard and use another." : "Save failed: "+ses.error.message, 6000); return; }
  const sid = ses.data.id, pts = [];
  ["forward","return"].forEach(dir=>{
    if(dir==="return" && returnType==="none") return;
    J[dir].forEach((p,i)=>{ const ll=p.marker.getLatLng(); pts.push({ session_id:sid, direction:dir, seq:i+1, role:roleOf(dir,i), mode:p.mode||null, label:p.label||null, lat:ll.lat, lng:ll.lng }); });
  });
  const exs = EXPS.map(e=>{ const ll=e.marker.getLatLng(); return { session_id:sid, category:e.type, category_label:CAT[e.type]?CAT[e.type].label:e.type, condition:e.condition, feeling:e.feeling, time_of_day:e.time, journey:e.journey, note:e.note||null, lat:ll.lat, lng:ll.lng }; });
  let r = await sb.from(T.points).insert(pts);
  if(!r.error && exs.length) r = await sb.from(T.exps).insert(exs);
  if(r.error){ await sb.from(T.sessions).delete().eq("id",sid); toast("Save failed: "+r.error.message+" (nothing was saved; your work is kept here)", 7000); return; }
  clearStoredDraft();
  const no = sessionNo; phase = "saved"; updateUI();
  openModal(el("div",{className:"card"},
    el("h2",{textContent:"Session "+no+" saved ✔"}),
    el("p",{className:"sub",textContent:`${pts.length} journey points and ${exs.length} safety experience${exs.length===1?"":"s"} were saved. Thank you!`}),
    btn("➕ Start another session","big",()=>{ closeModal(); resetSession(); showSessionPrompt(); }),
    btn("⬇ Download my data (CSV)","big",()=>$("btnCsv").click()),
    btn("Close","big",closeModal)));
}

/* ---------- CSV export (all of this user's saved sessions) ---------- */
function csvCell(v){
  if(v===null || v===undefined) return "";
  let s = String(v);
  if(typeof v==="string" && /^[=+\-@\t\r]/.test(s)) s = "'"+s;
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
async function fetchAll(table){
  const rows=[]; let from=0;
  while(true){
    const { data, error } = await sb.from(table).select("*").order("created_at",{ascending:true}).range(from,from+999);
    if(error) throw error;
    rows.push(...data);
    if(data.length<1000) break;
    from+=1000;
  }
  return rows;
}
$("btnCsv").onclick = async ()=>{
  if(!sb || !user){ toast("Log in first."); return; }
  toast("Preparing CSV…");
  try{
    const [ses,pts,exs] = await Promise.all([fetchAll(T.sessions),fetchAll(T.points),fetchAll(T.exps)]);
    const no = Object.fromEntries(ses.map(s=>[s.id,s.session_no]));
    const rows = [];
    pts.forEach(p=>rows.push({ record_type:"journey_point", session_no:no[p.session_id], direction:p.direction, seq:p.seq, role:p.role, mode:p.mode, lat:p.lat, lng:p.lng, label:p.label, created_at:p.created_at }));
    exs.forEach(e=>rows.push({ record_type:"experience", session_no:no[e.session_id], direction:e.journey, category:e.category_label, condition:e.condition, feeling:e.feeling, time_of_day:e.time_of_day, lat:e.lat, lng:e.lng, note:e.note, created_at:e.created_at }));
    const rt = r => r.record_type==="journey_point" ? 0 : 1;
    rows.sort((a,b)=> String(a.session_no).localeCompare(String(b.session_no),undefined,{numeric:true}) || rt(a)-rt(b) || String(a.direction).localeCompare(String(b.direction)) || (a.seq||0)-(b.seq||0));
    const cols = ["record_type","session_no","direction","seq","role","mode","category","condition","feeling","time_of_day","lat","lng","label","note","created_at"];
    const csv = "﻿"+[cols.join(","), ...rows.map(r=>cols.map(c=>csvCell(r[c])).join(","))].join("\r\n");
    const a = el("a",{ href:URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})), download:`safepath-${username}-${new Date().toISOString().slice(0,10)}.csv` });
    document.body.append(a); a.click(); a.remove();
    toast(`Downloaded ${rows.length} rows`);
  }catch(err){ toast("Export failed: "+err.message, 5000); }
};

/* ---------- accounts: username + password only (no email verification) ---------- */
function showAuth(mode){
  const msg = el("div",{className:"cardmsg"});
  const u = el("input",{type:"text", placeholder:"Username (letters, numbers, _)", autocomplete:"username", maxLength:24, autocapitalize:"none"});
  const p = el("input",{type:"password", placeholder:"Password (min 6 characters)", autocomplete: mode==="login"?"current-password":"new-password"});
  const submit = btn(mode==="login"?"Log in":"Create account","primary", async ()=>{
    msg.className="cardmsg"; msg.textContent="";
    const name = u.value.trim().toLowerCase();
    if(!/^[a-z0-9_]{3,24}$/.test(name)){ msg.textContent="Username must be 3–24 characters: letters, numbers or underscore."; return; }
    if(p.value.length<6){ msg.textContent="Password must be at least 6 characters."; return; }
    if(!configured){ msg.textContent="Supabase isn't configured yet (see the yellow banner)."; return; }
    submit.disabled = true;
    const email = `${name}@${USER_DOMAIN}`;
    if(mode==="login"){
      const { error } = await sb.auth.signInWithPassword({ email, password:p.value });
      if(error) msg.textContent = /invalid login/i.test(error.message) ? "Wrong username or password." : error.message;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password:p.value, options:{ data:{ username:name } } });
      if(error){
        if(/already|registered/i.test(error.message)) msg.textContent = "That username is taken. Try another.";
        else if(/invalid/i.test(error.message) && /email/i.test(error.message)) msg.textContent = "Supabase rejected the placeholder email domain “"+USER_DOMAIN+"”. Open the file and set USER_DOMAIN (in CONFIG) to a domain that has MX records, ideally one you own.";
        else msg.textContent = error.message;
      }
      else if(!data.session){ msg.textContent = "Account created, but Supabase still wants email confirmation. In Supabase turn OFF Authentication → Sign In / Providers → Email → “Confirm email”, then log in."; }
    }
    submit.disabled = false;
  });
  const onEnter = e=>{ if(e.key==="Enter") submit.click(); };
  u.addEventListener("keydown",onEnter); p.addEventListener("keydown",onEnter);
  const toggle = btn(mode==="login"?"New here? Create an account":"Already have an account? Log in","link",()=>showAuth(mode==="login"?"signup":"login"));
  openModal(el("div",{className:"card"},
    el("h2",{textContent: mode==="login"?"Log in":"Create account"}),
    el("p",{className:"sub",textContent: mode==="login" ? "Welcome back. Log in with your username and password." : "Choose a username and password – no email needed. Don't use your real name if you'd rather stay anonymous. There is no password reset, so remember it."}),
    msg, u, p, submit, toggle));
  setTimeout(()=>u.focus(),50);
}
$("btnOut").onclick = async ()=>{ if(sb) await sb.auth.signOut(); };

let authInit = false;
function applyUser(u){
  const id = u ? u.id : null;
  if(authInit && id === (user?user.id:null)) return;
  authInit = true;
  user = u;
  if(u){
    username = (u.user_metadata && u.user_metadata.username) || (u.email||"").split("@")[0];
    closeModal();
    const d = loadDraft();
    if(d && d.sessionNo && confirm("You have an unsaved session “"+d.sessionNo+"”. Resume it?")){
      try{ restoreDraft(d); return; }catch(err){ restoring=false; clearStoredDraft(); toast("Couldn't restore the draft.", 4000); }
    } else if(d){ clearStoredDraft(); }
    resetSession(); showSessionPrompt();
  } else {
    username = ""; resetSession(); showAuth("login");
  }
}
if(sb){
  sb.auth.getSession().then(({data})=>applyUser(data.session ? data.session.user : null));
  sb.auth.onAuthStateChange((_e,session)=>{ setTimeout(()=>applyUser(session ? session.user : null),0); });
} else { showAuth("login"); }

buildPalette();
updateUI();
map.invalidateSize();
window.addEventListener("load", ()=>map.invalidateSize());
window.addEventListener("resize", ()=>map.invalidateSize());
</script>
</body>
</html>
